[server]
debug_mode = 1
http_port  = 8888
http_addr  = 0.0.0.0
static_path = static
adapters   = template_generic, template_carrier

[tornado]
logging = info

[adapter.template_generic]
module = templategeneric.adapter.TemplateGenericAdapter

[adapter.template_carrier]
module = templatecarrier.adapter.TemplateCarrierAdapter

